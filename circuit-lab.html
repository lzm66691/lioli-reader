<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电路画板 · 莉萝阅读器</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#4D6BFE; --ok:#10B981; --warn:#F59E0B; --hot:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:700;letter-spacing:.03em}
  header .sub{font-size:11px;color:var(--muted)}
  .back{border:1px solid var(--accent);background:rgba(77,107,254,.15);color:var(--accent);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
  .back:hover{background:var(--accent);color:#fff}
  .parts{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .pbtn{border:1px solid var(--line);background:#263247;color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s}
  .pbtn:hover{background:#2e3c57;border-color:var(--accent)}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tbtn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 9px;border-radius:8px;font-size:11.5px;cursor:pointer}
  .tbtn:hover{color:var(--ink);border-color:var(--muted)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #canvas{flex:1;display:block;touch-action:none;background:radial-gradient(circle at 30% 30%, #16213a 0, #0b1326 70%)}
  #props{display:none;position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10}
  #props h4{font-size:12.5px;margin-bottom:7px;color:var(--accent)}
  #props label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0;color:var(--muted)}
  #props input[type=range]{width:90px}
  #props input[type=number]{width:62px;background:#0f172a;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:12px}
  #props button{margin-top:6px;width:100%;border:none;background:var(--accent);color:#fff;border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer}
  #status{position:absolute;right:14px;bottom:12px;background:rgba(30,41,59,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:11.5px;color:var(--muted);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:right;line-height:1.6}
  #status b{color:var(--ink);font-variant-numeric:tabular-nums}
  #drawer{position:absolute;left:12px;top:56px;bottom:64px;width:196px;background:rgba(30,41,59,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:8;display:flex;flex-direction:column;gap:8px;overflow:auto}
  #drawer h5{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  #drawer .lib-search{width:100%;background:#0f172a;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12px;outline:none}
  #drawer .lib-search:focus{border-color:var(--accent)}
  #drawer .lib-group{font-size:10.5px;color:#64748b;margin:6px 0 3px;letter-spacing:.04em}
  .lib-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:#263247;color:var(--ink);padding:6px 9px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s;text-align:left}
  .lib-btn:hover{background:#2e3c57;border-color:var(--accent)}
  .lib-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .lib-btn .src{font-size:8.5px;color:#64748b;background:rgba(100,116,139,.2);padding:1px 5px;border-radius:99px;margin-left:auto;font-weight:400}
  select.tpl{background:#0f172a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;cursor:pointer;outline:none}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,23,42,.92);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  .legend{position:absolute;left:222px;bottom:14px;font-size:10.5px;color:var(--muted);background:rgba(15,23,42,.7);padding:7px 10px;border-radius:8px;line-height:1.8}
  #fileIn{display:none}
  @media (max-width:760px){ header{font-size:12px} .sub{display:none} #status{left:10px;right:10px;bottom:10px;min-width:0;text-align:left} #drawer{left:8px;width:150px} .legend{display:none} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" title="返回阅读器主页">← 返回</button>
    <h1>⚡ 电路画板</h1>
    <span class="sub">KiCad 符号库 · 可导出 .kicad_sch（KiCad 8+ 兼容）</span>
    <select class="tpl" id="tplSel" title="预置示例电路图">
      <option value="">▾ 示例电路</option>
      <option value="series">串联电路（1灯）</option>
      <option value="twolamp">双灯串联</option>
      <option value="switch">开关控制</option>
    </select>
    <div class="parts" id="parts">
      <button class="tbtn" id="wireBtn" title="画走线：起点单击 → 折点单击 → 终点双击">🔗 走线</button>
      <button class="tbtn" id="textBtn" title="添加文字标注">🔤 标注</button>
      <button class="tbtn" id="nodeBtn" title="添加连接节点（T型接点）">● 节点</button>
      <button class="tbtn" id="boardBtn" title="画板框（PCB外形）">▭ 板框</button>
      <button class="tbtn" id="eraseBtn" title="橡皮：点选要删除的元素">🧽 橡皮</button>
      <button class="tbtn" id="rotBtn" title="旋转选中元件 90°（或按 R）">⟳ 旋转</button>
      <button class="tbtn" id="pngBtn" title="导出画板为 PNG 图片">📥 PNG</button>
      <button class="tbtn" id="schBtn" title="导出 KiCad 8+ 原理图 .kicad_sch">📤 SCH</button>
      <button class="tbtn" id="impBtn" title="导入 KiCad 原理图 .kicad_sch">📂 导入</button>
      <button class="tbtn" id="delBtn" title="删除选中元件">🗑 删除</button>
      <button class="tbtn" id="clearBtn" title="清空画布">✖ 清空</button>
      <button class="tbtn" id="shareBtn" title="复制当前电路链接">🔗 分享</button>
    </div>
  </header>
  <canvas id="canvas"></canvas>
  <input type="file" id="fileIn" accept=".kicad_sch,.sch">
  <div id="drawer">
    <h5>🧩 元件库 <span class="src">KiCad 标准符号</span></h5>
    <input class="lib-search" id="libSearch" placeholder="搜索元件…">
    <div class="lib-group">电源</div>
    <button class="lib-btn" data-part="BAT">🔋 电池</button>
    <button class="lib-btn" data-part="GND">⏚ 接地</button>
    <div class="lib-group">无源</div>
    <button class="lib-btn" data-part="R">➰ 电阻</button>
    <button class="lib-btn" data-part="POT">🎚 电位器</button>
    <button class="lib-btn" data-part="THERM">🌡 热敏电阻</button>
    <button class="lib-btn" data-part="C">⏺ 电容</button>
    <button class="lib-btn" data-part="L">🌀 电感</button>
    <button class="lib-btn" data-part="T">⇋ 变压器</button>
    <button class="lib-btn" data-part="X">💠 晶振</button>
    <button class="lib-btn" data-part="F">⚡ 保险丝</button>
    <button class="lib-btn" data-part="BULB">💡 灯泡</button>
    <button class="lib-btn" data-part="SP">📢 扬声器</button>
    <div class="lib-group">半导体</div>
    <button class="lib-btn" data-part="D">▶ 二极管</button>
    <button class="lib-btn" data-part="LED">🔴 LED</button>
    <button class="lib-btn" data-part="Q">🔻 三极管NPN</button>
    <button class="lib-btn" data-part="OP">△ 运放</button>
    <button class="lib-btn" data-part="VR">▣ 稳压器</button>
    <div class="lib-group">控制 · 连接</div>
    <button class="lib-btn" data-part="SW">🔘 开关</button>
    <button class="lib-btn" data-part="J">⏹ 连接器</button>
  </div>
  <div id="props"></div>
  <div id="status"><div id="statusBody">元件 0 · 走线 0 · 标注 0 · 节点 0 · 板框 0</div></div>
  <div class="legend">
    ① 元件：点元件库 → 画布单击放置<br>
    ② 走线：点「🔗 走线」，起点单击、折点单击、终点双击（吸附元件引脚）<br>
    ③ 旋转：选中元件后点「⟳」或按 R 键<br>
    ④ 画完 →「📥 PNG」存图 /「📤 SCH」导出 KiCad 原理图（.kicad_sch 可用真实 KiCad 打开）
  </div>
  <div id="toast"></div>
</div>

<script src="kicad-sym.js"></script>
<script>
(function(){
"use strict";
var cv = document.getElementById("canvas"), ctx = cv.getContext("2d");
var propsEl = document.getElementById("props"), statusEl = document.getElementById("statusBody"), toastEl = document.getElementById("toast");

/* ---------- 数据模型（v3：KiCad 符号 + 引脚） ---------- */
var SCALE = 24;   /* px / mm（KiCad 坐标） */
var NODE_R = 8;
var parts = [];       /* {id,type,x,y,rot,val,on, pins:[{num,x,y,dir}], sym} */
var wires = [];       /* {id, a:{pid,pin,abs,x,y}, b:{...}, pts} */
var texts = [], nodes = [], boards = [];
var selected = null, placing = null, mode = "select";
var dragWire = null, dragEl = null;
var wirePts = [];
var boardDrag = null;
var uid = 1, toastT = null;

function ROT_XY(p, rot){ /* 绕原点旋转 rot*90°（KiCad 角度：正=逆时针） */
  if (!rot) return p;
  var r = rot % 360, rad = r * Math.PI / 180;
  return {x: p.x*Math.cos(rad) - p.y*Math.sin(rad), y: p.x*Math.sin(rad) + p.y*Math.cos(rad)};
}
function addPart(type, x, y){
  var sym = KICAD_SYMS[type];
  if (!sym) return null;
  var p = {id:uid++, type:type, x:x, y:y, rot:0, val:null, on:true, sym:sym, pins:[]};
  sym.pins.forEach(function(pn){
    /* KiCad 符号库 y 向上 → 画板 y 向下，引脚 Y 取反（萝评审：absolute_Y = symbol_Y - pin_Y） */
    p.pins.push({num:pn.num, x:pn.x*SCALE, y:-pn.y*SCALE, dir:pn.dir});
  });
  var def = {BAT:9, R:1000, C:10, L:10, BULB:200, POT:10, THERM:1000, F:2};
  if (def[type] !== undefined) p.val = def[type];
  parts.push(p);
  return p;
}
function pinEnd(p, pin){
  var pp = p.pins.find(function(x){ return x.num === pin; });
  if (!pp) return {x:p.x, y:p.y};
  var g = ROT_XY({x:pp.x, y:pp.y}, p.rot);
  return {x:p.x + g.x, y:p.y + g.y};
}
function partPinCount(p){ return p.sym.pins.length; }

/* ---------- 网格吸附 ---------- */
var GRID = 24;   /* 1 个 KiCad 网格 = 1mm * 24px */
function snap(v){ return Math.round(v / GRID) * GRID; }
function snapPt(x, y){ return {x:snap(x), y:snap(y)}; }

/* ---------- 渲染 ---------- */
function fitSize(){ cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
function resize(){ fitSize(); draw(); }
window.addEventListener("resize", resize);

function endpoint(ref){
  if (ref.abs) return {x:ref.x, y:ref.y};
  var p = parts.find(function(x){ return x.id === ref.pid; });
  return p ? pinEnd(p, ref.pin) : {x:0,y:0};
}

function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawGrid();
  boards.forEach(function(b){
    ctx.beginPath(); ctx.rect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = "rgba(56,189,248,.06)"; ctx.fill();
  });
  wires.forEach(function(w){
    var a = endpoint(w.a), b = endpoint(w.b);
    var pts = [a].concat(w.pts || []).concat([b]);
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2.4; ctx.stroke();
  });
  nodes.forEach(function(n){
    ctx.beginPath(); ctx.arc(n.x, n.y, 4.5, 0, 7); ctx.fillStyle = "#facc15"; ctx.fill();
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.4; ctx.stroke();
  });
  texts.forEach(function(t){
    ctx.font = "13px system-ui"; ctx.textAlign = "left";
    ctx.fillStyle = "#e2e8f0"; ctx.fillText(t.txt, t.x, t.y);
  });
  parts.forEach(function(p){
    var hot = (selected && selected.id === p.id) || (placing && placing.id === p.id);
    drawPart(p, hot);
    p.pins.forEach(function(pn){
      var e = pinEnd(p, pn.num);
      ctx.beginPath(); ctx.arc(e.x, e.y, NODE_R, 0, 7);
      ctx.fillStyle = "#cbd5e1"; ctx.fill();
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, 7); ctx.fill();
      ctx.font = "8.5px system-ui"; ctx.textAlign = "center";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText(pn.num, e.x, e.y - 9);
    });
  });
  if (dragWire){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(dragWire.x0, dragWire.y0); ctx.lineTo(dragWire.x1, dragWire.y1);
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  }
  if (mode === "wire" && wirePts.length){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(wirePts[0].x, wirePts[0].y);
    for (var j = 1; j < wirePts.length; j++) ctx.lineTo(wirePts[j].x, wirePts[j].y);
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
    wirePts.forEach(function(pt){ ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, 7); ctx.fillStyle = "#facc15"; ctx.fill(); });
  }
  if (boardDrag){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.rect(boardDrag.x0, boardDrag.y0, boardDrag.x1 - boardDrag.x0, boardDrag.y1 - boardDrag.y0);
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  }
  if (placing){ ctx.globalAlpha = .45; drawPart(placing, true); ctx.globalAlpha = 1; }
}

function drawGrid(){
  ctx.strokeStyle = "rgba(51,65,85,.35)"; ctx.lineWidth = 1;
  var step = 24;
  for (var x = step; x < cv.clientWidth; x += step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.clientHeight); ctx.stroke(); }
  for (var y = step; y < cv.clientHeight; y += step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.clientWidth,y); ctx.stroke(); }
}

function drawPart(p, hot){
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.rot) ctx.rotate(p.rot * Math.PI / 180);
  var ink = hot ? "#facc15" : "#e2e8f0";
  (p.sym.elems || []).forEach(function(el){
    ctx.lineWidth = el.w || 2.2;
    ctx.strokeStyle = ink;
    if (el.t === "line"){
      ctx.beginPath(); ctx.moveTo(el.a[0]*SCALE, -el.a[1]*SCALE); ctx.lineTo(el.b[0]*SCALE, -el.b[1]*SCALE); ctx.stroke();
    } else if (el.t === "rect"){
      ctx.beginPath(); ctx.rect(el.a[0]*SCALE, -el.b[1]*SCALE, (el.b[0]-el.a[0])*SCALE, (el.b[1]-el.a[1])*SCALE); ctx.stroke();
    } else if (el.t === "circle"){
      ctx.beginPath(); ctx.arc(el.c[0]*SCALE, -el.c[1]*SCALE, el.r*SCALE, 0, 7); ctx.stroke();
    } else if (el.t === "arc"){
      ctx.beginPath(); ctx.arc(el.c[0]*SCALE, -el.c[1]*SCALE, el.r*SCALE, (el.a1)*Math.PI/180, (el.a2)*Math.PI/180, true); ctx.stroke();
    } else if (el.t === "poly"){
      ctx.beginPath();
      ctx.moveTo(el.pts[0][0]*SCALE, -el.pts[0][1]*SCALE);
      for (var i = 1; i < el.pts.length; i++) ctx.lineTo(el.pts[i][0]*SCALE, -el.pts[i][1]*SCALE);
      ctx.closePath();
      if (el.fill){ ctx.fillStyle = ink; ctx.fill(); } else ctx.stroke();
    }
  });
  ctx.restore();
  /* 标签 */
  ctx.font = "10px system-ui"; ctx.textAlign = "center";
  var tag = (p.sym.ref ? p.sym.ref : "") + (p.val != null ? " " + fmtVal(p) : "");
  if (tag){
    var ty = p.y - 20 - (p.sym.ref ? 0 : 10);
    if (hot){ ctx.fillStyle = "#0f172a"; var w = ctx.measureText(tag).width + 10; ctx.fillRect(p.x - w/2, ty - 11, w, 16); }
    ctx.fillStyle = hot ? "#facc15" : "#94a3b8";
    ctx.fillText(tag, p.x, ty);
  }
}
function fmtVal(p){
  var v = p.val;
  if (v == null) return "";
  if (p.type === "R" || p.type === "POT" || p.type === "THERM" || p.type === "BULB"){
    return v >= 1e6 ? (v/1e6).toFixed(1)+"MΩ" : v >= 1000 ? (v/1000).toFixed(1)+"kΩ" : v.toFixed(0)+"Ω";
  }
  if (p.type === "C") return v >= 1000 ? (v/1000).toFixed(1)+"mF" : v >= 1 ? v.toFixed(1)+"µF" : (v*1000).toFixed(0)+"nF";
  if (p.type === "L") return v.toFixed(0)+"mH";
  if (p.type === "BAT") return v.toFixed(1)+"V";
  if (p.type === "F") return v.toFixed(1)+"A";
  return String(v);
}

/* ---------- 命中测试 ---------- */
function hitPin(px, py){
  for (var i = parts.length-1; i >= 0; i--){
    var p = parts[i];
    for (var j = 0; j < p.pins.length; j++){
      var e = pinEnd(p, p.pins[j].num);
      if (Math.hypot(px-e.x, py-e.y) <= NODE_R + 6) return {pid:p.id, pin:p.pins[j].num};
    }
  }
  return null;
}
function hitPart(px, py){
  for (var i = parts.length-1; i >= 0; i--){
    var p = parts[i];
    var d = Math.hypot(px-p.x, py-p.y);
    if (d <= 48) return p;
  }
  return null;
}
function hitText(px, py){
  for (var i = texts.length-1; i >= 0; i--){ var t = texts[i]; if (Math.abs(px-t.x) <= 60 && Math.abs(py-t.y) <= 10) return t; }
  return null;
}
function hitNodePt(px, py){
  for (var i = nodes.length-1; i >= 0; i--){ var n = nodes[i]; if (Math.hypot(px-n.x, py-n.y) <= 8) return n; }
  return null;
}
function hitBoard(px, py){
  for (var i = boards.length-1; i >= 0; i--){ var b = boards[i]; if (px >= b.x0-4 && px <= b.x1+4 && py >= b.y0-4 && py <= b.y1+4) return b; }
  return null;
}
function hitWire(px, py){
  for (var i = wires.length-1; i >= 0; i--){
    var w = wires[i];
    var a = endpoint(w.a), b = endpoint(w.b);
    var pts = [a].concat(w.pts || []).concat([b]);
    for (var j = 0; j < pts.length-1; j++){
      var p1 = pts[j], p2 = pts[j+1];
      var d = Math.abs((p2.y-p1.y)*px - (p2.x-p1.x)*py + p2.x*p1.y - p2.y*p1.x) / Math.hypot(p2.x-p1.x, p2.y-p1.y);
      if (d <= 5 && px >= Math.min(p1.x,p2.x)-4 && px <= Math.max(p1.x,p2.x)+4 && py >= Math.min(p1.y,p2.y)-4 && py <= Math.max(p1.y,p2.y)+4) return w;
    }
  }
  return null;
}

/* ---------- 交互 ---------- */
function toLocal(e){ var r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

cv.addEventListener("pointerdown", function(e){
  var pt = toLocal(e);
  if (placing){
    var p = addPart(placing.type, snap(pt.x), snap(pt.y)); placing = null; mode = "select";
    document.querySelectorAll(".lib-btn").forEach(function(b){ b.classList.remove("on"); });
    refreshStatus(); draw(); return;
  }
  if (mode === "board"){ boardDrag = {x0: snap(pt.x), y0: snap(pt.y), x1: snap(pt.x), y1: snap(pt.y)}; return; }
  if (mode === "erase"){
    var hp = hitPart(pt.x, pt.y);
    if (hp){ parts = parts.filter(function(x){ return x.id !== hp.id; }); wires = wires.filter(function(w){ return w.a.pid !== hp.id && w.b.pid !== hp.id; }); refreshStatus(); draw(); return; }
    var hw = hitWire(pt.x, pt.y);
    if (hw){ wires = wires.filter(function(w){ return w.id !== hw.id; }); refreshStatus(); draw(); return; }
    var ht = hitText(pt.x, pt.y);
    if (ht){ texts = texts.filter(function(t){ return t.id !== ht.id; }); refreshStatus(); draw(); return; }
    var hn = hitNodePt(pt.x, pt.y);
    if (hn){ nodes = nodes.filter(function(n){ return n.id !== hn.id; }); refreshStatus(); draw(); return; }
    var hb = hitBoard(pt.x, pt.y);
    if (hb){ boards = boards.filter(function(b){ return b.id !== hb.id; }); refreshStatus(); draw(); return; }
    return;
  }
  if (mode === "text"){
    var txt = window.prompt("标注内容：", "");
    if (txt){ texts.push({id:uid++, x:snap(pt.x), y:snap(pt.y), txt:txt}); refreshStatus(); draw(); }
    return;
  }
  if (mode === "node"){ nodes.push({id:uid++, x:snap(pt.x), y:snap(pt.y)}); refreshStatus(); draw(); return; }
  if (mode === "wire"){
    var hn = hitPin(pt.x, pt.y);
    if (hn){
      if (!wirePts.length) wirePts.push({pid:hn.pid, pin:hn.pin});
      else finishWire({pid:hn.pid, pin:hn.pin});
      draw(); return;
    }
    if (wirePts.length){ wirePts.push({abs:true, x:snap(pt.x), y:snap(pt.y)}); draw(); return; }
    wirePts.push({abs:true, x:snap(pt.x), y:snap(pt.y)}); draw(); return;
  }
  var hn2 = hitPin(pt.x, pt.y);
  if (hn2){ dragWire = {x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y, from: hn2}; return; }
  var hp2 = hitPart(pt.x, pt.y);
  if (hp2){ selected = hp2; dragEl = hp2; showProps(hp2); draw(); return; }
  selected = null; hideProps(); draw();
});
cv.addEventListener("pointermove", function(e){

  if (boardDrag){ boardDrag.x1 = snap(pt.x); boardDrag.y1 = snap(pt.y); draw(); return; }

      if (!dup) wires.push({id:uid++, a:dragWire.from, b:hn});

  }

/* ---------- KiCad .kicad_sch 导出 ---------- */
function uuid(){ return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){ var r = Math.random()*16|0; var v = c==="x"?r:(r&0x3|0x8); return v.toString(16); }); }
function mm(px){ return Math.round(px / SCALE * 100) / 100; }
function schAngle(dir, rot){ return String(((dir + (rot||0)) % 360)); }

function exportSch(){
  var L = [];
  L.push('(kicad_sch (version 20231120) (generator "lioli-reader")');
  L.push('  (uuid "' + uuid() + '")');
  L.push('  (paper "A4")');
  L.push('  (lib_symbols');
  /* 收集用到的符号定义（去重） */
  var used = {};
  parts.forEach(function(p){ used[p.type] = p.sym; });
  Object.keys(used).forEach(function(t){
    var sym = used[t];
    var libId = "Device:" + (t === "GND" ? "GND" : sym.ref);
    L.push('    (symbol "' + libId + '"');
    L.push('      (pin_names (offset 1.016))');
    L.push('      (exclude_from_sim no)');
    L.push('      (in_bom yes) (on_board yes)');
    L.push('      (property "Reference" "' + sym.ref + '" (at 0 2.54 0) (effects (font (size 1.27 1.27))))');
    L.push('      (property "Value" "' + sym.ref + '" (at 0 -2.54 0) (effects (font (size 1.27 1.27))))');
    L.push('      (symbol "' + sym.ref + '_0_1"');
    sym.elems.forEach(function(el){
      if (el.t === "line"){
        L.push('        (polyline (pts (xy ' + el.a[0] + ' ' + el.a[1] + ') (xy ' + el.b[0] + ' ' + el.b[1] + ')) (stroke (width 0.254)) (fill (type none)))');
      } else if (el.t === "rect"){
        L.push('        (rectangle (start ' + el.a[0] + ' ' + el.b[1] + ') (end ' + el.b[0] + ' ' + el.a[1] + ') (stroke (width 0.254)) (fill (type ' + (el.fill ? "background" : "none") + ')))');
      } else if (el.t === "circle"){
        L.push('        (circle (center ' + el.c[0] + ' ' + el.c[1] + ') (radius ' + el.r + ') (stroke (width 0.254)) (fill (type ' + (el.fill ? "background" : "none") + ')))');
      } else if (el.t === "poly"){
        var pts = el.pts.map(function(q){ return "(xy " + q[0] + " " + q[1] + ")"; }).join(" ");
        L.push('        (polyline (pts ' + pts + ') (stroke (width 0.254)) (fill (type ' + (el.fill ? "background" : "none") + ')))');
      }
    });
    sym.pins.forEach(function(pn){
      L.push('        (pin "' + pn.num + '" (at ' + pn.x + ' ' + pn.y + ' ' + pn.dir + ') (length 2.54) (name "' + pn.num + '") (number "' + pn.num + '") (effects (font (size 1.016 1.016))))');
    });
    L.push('      )');
    L.push('    )');
  });
  L.push('  )');
  /* 实例 */
  var refCount = {};
  parts.forEach(function(p){
    var sym = p.sym;
    var libId = "Device:" + (p.type === "GND" ? "GND" : sym.ref);
    refCount[p.type] = (refCount[p.type] || 0) + 1;
    var ref = sym.ref + refCount[p.type];
    var px = mm(p.x), py = mm(p.y);
    var xp = Math.round(px*100)/100, yp = Math.round(py*100)/100;
    var u1 = uuid();
    L.push('  (symbol (lib_id "' + libId + '") (at ' + xp + ' ' + yp + ' ' + (p.rot||0) + ') (unit 1) (in_bom yes) (on_board yes)');
    L.push('    (uuid "' + u1 + '")');
    var val = p.val != null ? fmtVal(p) : sym.ref;
    L.push('    (property "Reference" "' + ref + '" (at ' + xp + ' ' + Math.round((mm(p.y)+3)*100)/100 + ' 0) (effects (font (size 1.27 1.27)) (justify left)))');
    L.push('    (property "Value" "' + val + '" (at ' + xp + ' ' + Math.round((mm(p.y)-3)*100)/100 + ' 0) (effects (font (size 1.27 1.27)) (justify left)))');
    p.pins.forEach(function(pn){ L.push('    (pin "' + pn.num + '" (uuid "' + uuid() + '"))'); });
    L.push('  )');
  });
  /* 走线 */
  wires.forEach(function(w){
    var a = endpoint(w.a), b = endpoint(w.b);
    var pts = [a].concat(w.pts || []).concat([b]);
    var s = pts.map(function(q){ return "(xy " + mm(q.x) + " " + mm(q.y) + ")"; }).join(" ");
    L.push('  (wire (pts ' + s + ') (stroke (width 0)) (uuid "' + uuid() + '"))');
  });
  L.push(')');
  var text = L.join("\n");
  var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.download = "电路画板.kicad_sch";
  a.href = URL.createObjectURL(blob);
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast("已导出 .kicad_sch（KiCad 8+ 可打开继续编辑）");
}

function importSch(txt){
  parts = []; wires = []; texts = []; nodes = []; boards = [];
  selected = null; placing = null; wirePts = [];
  /* 简单 s-expr 扫描：symbol 实例与 wire（KiCad 属性顺序：Reference 在 Value 前） */
  var reSym = /\(symbol\s+\(lib_id\s+"([^"]+)"\)\s+\(at\s+([\d.\-]+)\s+([\d.\-]+)\s+([\d.\-]+)\)[\s\S]*?\(property\s+"Reference"\s+"([^"]*)"[\s\S]*?\(property\s+"Value"\s+"([^"]*)"[\s\S]*?\)\s*\)/g;
  var m, idMap = {}, refCount = {};
  while ((m = reSym.exec(txt))){
    var lib = m[1];            /* Device:R */
    var type = lib.split(":")[1];
    /* 映射回符号 key（R→R, GND→GND, D→D, LED→LED ...） */
    var key = type;
    if (!KICAD_SYMS[key]){
      /* 尝试反查：sym.ref === type */
      var found = null;
      Object.keys(KICAD_SYMS).forEach(function(k){ if (KICAD_SYMS[k].ref === type) found = k; });
      if (!found) continue;
      key = found;
    }
    var p = addPart(key, Math.round(parseFloat(m[2]) * SCALE), Math.round(parseFloat(m[3]) * SCALE));
    p.rot = Math.round(parseFloat(m[4])) % 360;
    var val = m[6].replace(/[ΩµmnFAkMVH]/g, "");
    if (val && !isNaN(parseFloat(val))) p.val = parseFloat(val);
  }
  /* wire 直接用绝对坐标 */
  var reWire = /\(wire\s+\(pts\s+((?:\(xy\s+[\d.\-]+\s+[\d.\-]+\)\s*)+)\)/g;
  while ((m = reWire.exec(txt))){
    var pts = [];
    var rePts = /\(xy\s+([\d.\-]+)\s+([\d.\-]+)\)/g, q;
    while ((q = rePts.exec(m[1]))) pts.push({abs:true, x:Math.round(parseFloat(q[1])*SCALE), y:Math.round(parseFloat(q[2])*SCALE)});
    if (pts.length >= 2){
      wires.push({id:uid++, a:pts[0], b:pts[pts.length-1], pts:pts.slice(1,-1)});
    }
  }
  refreshStatus(); autoFit(); draw();
}
/* 导入/加载后自动缩放平移，让电路进入可视区 */
function autoFit(){
  var xs = [], ys = [];
  parts.forEach(function(p){ xs.push(p.x); ys.push(p.y); });
  wires.forEach(function(w){
    var a = endpoint(w.a), b = endpoint(w.b);
    xs.push(a.x, b.x); ys.push(a.y, b.y);
    (w.pts || []).forEach(function(q){ if (q.abs){ xs.push(q.x); ys.push(q.y); } });
  });
  if (!xs.length) return;
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var bw = maxX - minX || 1, bh = maxY - minY || 1;
  var cw = cv.clientWidth - 180, ch = cv.clientHeight - 150;
  var s = Math.min(cw / bw, ch / bh, 1.5);
  var dx = (cw / 2) - (minX + maxX) / 2 * s, dy = (ch / 2) - (minY + maxY) / 2 * s;
  if (s === 1 && dx === 0 && dy === 0) return;
  parts.forEach(function(p){ p.x = Math.round(p.x * s + dx); p.y = Math.round(p.y * s + dy); });
  wires.forEach(function(w){
    [w.a, w.b].concat(w.pts || []).forEach(function(r){
      if (r.abs){ r.x = Math.round(r.x * s + dx); r.y = Math.round(r.y * s + dy); }
    });
  });
  nodes.forEach(function(n){ n.x = Math.round(n.x * s + dx); n.y = Math.round(n.y * s + dy); });
  texts.forEach(function(t){ t.x = Math.round(t.x * s + dx); t.y = Math.round(t.y * s + dy); });
}

/* ---------- 序列化 / 分享（v3） ---------- */
function serialize(){
  return { v:3,
    p: parts.map(function(p){ return [p.id, p.type, Math.round(p.x), Math.round(p.y), p.rot||0, p.val, p.on ? 1:0]; }),
    w: wires.map(function(w){ return [w.a, w.b, w.pts || []]; }),
    t: texts.map(function(t){ return [t.x, t.y, t.txt]; }),
    n: nodes.map(function(n){ return [n.x, n.y]; }),
    b: boards.map(function(b){ return [b.x0, b.y0, b.x1, b.y1]; }) };
}
function restore(data){
  parts = []; wires = []; texts = []; nodes = []; boards = [];
  selected = null; placing = null; wirePts = [];
  var idMap = {};
  var legacyP = data && Array.isArray(data.p) && data.p.length && typeof data.p[0][0] === "string";
  if (legacyP || !data.v){
    /* 旧 v1/v2：[type,x,y,val,on] */
    data.p.forEach(function(a, i){
      var legacy = typeof a[0] === "string";
      var type = legacy ? a[0] : a[1];
      var key = type;
      var map = {battery:"BAT", resistor:"R", capacitor:"C", inductor:"L", diode:"D", led:"LED", npn:"Q", switch:"SW", bulb:"BULB", speaker:"SP", transformer:"T", ground:"GND"};
      if (map[key]) key = map[key];
      if (!KICAD_SYMS[key]) return;
      var p = addPart(key, legacy ? a[1] : a[2], legacy ? a[2] : a[3]);
      if (!legacy && a[4] != null) p.val = a[4];
      if (!legacy && a[5] != null) p.on = a[5] === 1;
      idMap[legacy ? i : a[0]] = p.id;
    });
    (data.w || []).forEach(function(w){
      if (Array.isArray(w) && w.length === 4){
        /* 旧格式 [pid,node,pid,node] → pin 映射（node 0→第1脚，1→第2脚） */
        var pa = parts.find(function(x){ return x.id === idMap[w[0]]; });
        var pb = parts.find(function(x){ return x.id === idMap[w[2]]; });
        if (pa && pb && pa.pins[w[1]] && pb.pins[w[3]]){
          wires.push({id:uid++, a:{pid:pa.id, pin:pa.pins[w[1]].num}, b:{pid:pb.id, pin:pb.pins[w[3]].num}});
        }
      } else if (Array.isArray(w) && w.length >= 2){
        var A = w[0], B = w[1];
        var AA = A.abs ? {abs:true,x:A.x,y:A.y} : {pid:idMap[A.pid], pin:A.pin};
        var BB = B.abs ? {abs:true,x:B.x,y:B.y} : {pid:idMap[B.pid], pin:B.pin};
        wires.push({id:uid++, a:AA, b:BB, pts:(w[2]||[]).map(function(q){ return q.abs?{abs:true,x:q.x,y:q.y}:{pid:idMap[q.pid],pin:q.pin}; })});
      }
    });
  } else {
    data.p.forEach(function(a){ var p = addPart(a[1], a[2], a[3]); if (p){ p.rot = a[4]||0; p.val = a[5]; p.on = a[6] === 1; } idMap[a[0]] = p ? p.id : null; });
    (data.w || []).forEach(function(w){
      if (!Array.isArray(w) || w.length < 2) return;
      var A = w[0], B = w[1];
      var AA = A.abs ? {abs:true,x:A.x,y:A.y} : {pid:idMap[A.pid], pin:A.pin};
      var BB = B.abs ? {abs:true,x:B.x,y:B.y} : {pid:idMap[B.pid], pin:B.pin};
      wires.push({id:uid++, a:AA, b:BB, pts:(w[2]||[]).map(function(q){ return q.abs?{abs:true,x:q.x,y:q.y}:{pid:idMap[q.pid],pin:q.pin}; })});
    });
    (data.t || []).forEach(function(t){ texts.push({id:uid++, x:t[0], y:t[1], txt:t[2]}); });
    (data.n || []).forEach(function(n){ nodes.push({id:uid++, x:n[0], y:n[1]}); });
    (data.b || []).forEach(function(b){ boards.push({id:uid++, x0:b[0], y0:b[1], x1:b[2], y1:b[3]}); });
  }
  refreshStatus(); draw();
}
function share(){
  var s = JSON.stringify(serialize());
  var url = location.origin + location.pathname + "#" + encodeURIComponent(s);
  try{ navigator.clipboard.writeText(url).then(function(){ toast("画板链接已复制，粘贴到浏览器即可打开"); }); }
  catch(e){ toast(url.slice(0,60) + "…"); }
}
(function(){
  var h = location.hash.slice(1);
  if (h){
    try{ restore(JSON.parse(decodeURIComponent(h))); toast("已载入分享的画板"); }
    catch(e){ toast("画板链接无法解析"); }
  }
})();

function toast(msg){
  toastEl.textContent = msg; toastEl.style.opacity = "1";
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.style.opacity = "0"; }, 2400);
}

resize();
refreshStatus();
})();
</script>
