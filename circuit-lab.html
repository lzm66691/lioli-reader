<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电路画板 · 莉萝阅读器</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#4D6BFE; --ok:#10B981; --warn:#F59E0B; --hot:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:700;letter-spacing:.03em}
  header .sub{font-size:11px;color:var(--muted)}
  .back{border:1px solid var(--accent);background:rgba(77,107,254,.15);color:var(--accent);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
  .back:hover{background:var(--accent);color:#fff}
  .parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .pbtn{border:1px solid var(--line);background:#263247;color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s}
  .pbtn:hover{background:#2e3c57;border-color:var(--accent)}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tbtn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 9px;border-radius:8px;font-size:11.5px;cursor:pointer}
  .tbtn:hover{color:var(--ink);border-color:var(--muted)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #canvas{flex:1;display:block;touch-action:none;background:radial-gradient(circle at 30% 30%, #16213a 0, #0b1326 70%)}
  #props{display:none;position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10}
  #props h4{font-size:12.5px;margin-bottom:7px;color:var(--accent)}
  #props label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0;color:var(--muted)}
  #props input[type=range]{width:90px}
  #props input[type=number]{width:62px;background:#0f172a;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:12px}
  #props button{margin-top:6px;width:100%;border:none;background:var(--accent);color:#fff;border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer}
  #status{position:absolute;right:14px;bottom:12px;background:rgba(30,41,59,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:11.5px;color:var(--muted);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:right;line-height:1.6}
  #status b{color:var(--ink);font-variant-numeric:tabular-nums}
  /* ---- 元件库抽屉 ---- */
  #drawer{position:absolute;left:12px;top:56px;bottom:64px;width:196px;background:rgba(30,41,59,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:8;display:flex;flex-direction:column;gap:8px;overflow:auto}
  #drawer h5{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  #drawer .lib-search{width:100%;background:#0f172a;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12px;outline:none}
  #drawer .lib-search:focus{border-color:var(--accent)}
  #drawer .lib-group{font-size:10.5px;color:#64748b;margin:6px 0 3px;letter-spacing:.04em}
  .lib-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:#263247;color:var(--ink);padding:6px 9px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s;text-align:left}
  .lib-btn:hover{background:#2e3c57;border-color:var(--accent)}
  .lib-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  select.tpl{background:#0f172a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;cursor:pointer;outline:none}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,23,42,.92);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  .legend{position:absolute;left:222px;bottom:14px;font-size:10.5px;color:var(--muted);background:rgba(15,23,42,.7);padding:7px 10px;border-radius:8px;line-height:1.8}
  @media (max-width:760px){ header{font-size:12px} .sub{display:none} #status{left:10px;right:10px;bottom:10px;min-width:0;text-align:left} #drawer{left:8px;width:150px} .legend{display:none} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" title="返回阅读器主页">← 返回</button>
    <h1>⚡ 电路画板</h1>
    <span class="sub">画板模式 · 元件 + 走线 + 标注（非仿真）</span>
    <select class="tpl" id="tplSel" title="预置示例电路图">
      <option value="">▾ 示例电路</option>
      <option value="series">串联电路（1灯）</option>
      <option value="twolamp">双灯串联</option>
      <option value="switch">开关控制</option>
    </select>
    <div class="parts" id="parts">
      <button class="tbtn" id="wireBtn" title="画走线：起点单击 → 折点单击 → 终点双击">🔗 走线</button>
      <button class="tbtn" id="textBtn" title="添加文字标注">🔤 标注</button>
      <button class="tbtn" id="nodeBtn" title="添加连接节点（T型接点）">● 节点</button>
      <button class="tbtn" id="boardBtn" title="画板框（PCB外形）">▭ 板框</button>
      <button class="tbtn" id="eraseBtn" title="橡皮：点选要删除的元素">🧽 橡皮</button>
      <button class="tbtn" id="pngBtn" title="导出画板为 PNG 图片">📥 导出PNG</button>
      <button class="tbtn" id="delBtn" title="删除选中元件">🗑 删除</button>
      <button class="tbtn" id="clearBtn" title="清空画布">✖ 清空</button>
      <button class="tbtn" id="shareBtn" title="复制当前电路链接">🔗 分享</button>
    </div>
  </header>
  <canvas id="canvas"></canvas>
  <div id="drawer">
    <h5>🧩 元件库（点选后放画布）</h5>
    <input class="lib-search" id="libSearch" placeholder="搜索元件…">
    <div class="lib-group">电源</div>
    <button class="lib-btn" data-part="battery">🔋 电池</button>
    <button class="lib-btn" data-part="ground">⏚ 接地</button>
    <div class="lib-group">无源</div>
    <button class="lib-btn" data-part="resistor">➰ 电阻</button>
    <button class="lib-btn" data-part="capacitor">⏺ 电容</button>
    <button class="lib-btn" data-part="inductor">🌀 电感</button>
    <button class="lib-btn" data-part="bulb">💡 灯泡</button>
    <div class="lib-group">半导体</div>
    <button class="lib-btn" data-part="diode">▶ 二极管</button>
    <button class="lib-btn" data-part="led">🔴 LED</button>
    <button class="lib-btn" data-part="npn">🔻 三极管NPN</button>
    <div class="lib-group">控制 · 其他</div>
    <button class="lib-btn" data-part="switch">🔘 开关</button>
    <button class="lib-btn" data-part="speaker">📢 扬声器</button>
    <button class="lib-btn" data-part="transformer">⇋ 变压器</button>
  </div>
  <div id="props"></div>
  <div id="status"><div id="statusBody">元件 0 · 走线 0 · 标注 0 · 节点 0 · 板框 0</div></div>
  <div class="legend">
    ① 元件：点元件库 → 画布单击放置<br>
    ② 走线：点「🔗 走线」，起点单击、中间折点单击、终点双击（接到元件端点自动吸附）<br>
    ③ 标注/节点/板框：点对应工具后直接在画布操作<br>
    ④ 画完后点「📥 导出PNG」保存图片
  </div>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";
var cv = document.getElementById("canvas"), ctx = cv.getContext("2d");
var propsEl = document.getElementById("props"), statusEl = document.getElementById("statusBody"), toastEl = document.getElementById("toast");

/* ---------- 数据模型 ---------- */
var NODE_R = 9;
var parts = [];              /* {id,type,x,y,val,on, n0:{x,y}, n1:{x,y}} */
var wires = [];              /* {id, a:{pid,node,x,y,abs}, b:{...}, pts:[折点]} */
var texts = [];              /* {id,x,y,txt} */
var nodes = [];              /* {id,x,y} */
var boards = [];             /* {id,x0,y0,x1,y1} */
var selected = null, placing = null, mode = "select";
var dragWire = null, dragEl = null, dragNode = null;
var wirePts = [];            /* 走线折点序列 */
var boardDrag = null;
var uid = 1, toastT = null;

function newNode(x, y){ return {x:x, y:y}; }
function nodeOf(p, k){ return k === 0 ? p.n0 : p.n1; }

/* ---------- 网格吸附 ---------- */
var GRID = 30;
function snap(v){ return Math.round(v / GRID) * GRID; }
function snapPt(x, y){ return {x:snap(x), y:snap(y)}; }

function addPart(type, x, y){
  var sp = snapPt(x, y);
  var p = {id:uid++, type:type, x:sp.x, y:sp.y, on:true};
  var dx = 55, dy = 0;
  p.n0 = newNode(x-dx, y); p.n1 = newNode(x+dx, y);
  if (type === "battery") p.val = 9;
  else if (type === "resistor") p.val = 1000;
  else if (type === "capacitor") p.val = 10;
  else if (type === "inductor") p.val = 10;
  else if (type === "bulb") p.val = 200;
  else if (type === "switch"){ p.val = 0; p.on = true; }
  else if (type === "npn"){ p.n1 = newNode(x+30, y); }
  else if (type === "transformer"){ p.n0 = newNode(x-70,y); p.n1 = newNode(x+70,y); }
  else if (type === "ground"){ p.n0 = newNode(x-14,y); p.n1 = newNode(x+14,y); }
  else if (type === "speaker"){ p.n0 = newNode(x-24,y); p.n1 = newNode(x+24,y); }
  parts.push(p);
  return p;
}

/* ---------- 渲染 ---------- */
function fitSize(){ cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
function resize(){ fitSize(); draw(); }
window.addEventListener("resize", resize);

function endpoint(ref){
  if (ref.abs) return {x:ref.x, y:ref.y};
  var p = parts.find(function(x){ return x.id === ref.pid; });
  return p ? nodeOf(p, ref.node) : {x:0,y:0};
}
function wireEnd(ref){ var e = endpoint(ref); return e; }

function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawGrid();
  /* 板框（底层） */
  boards.forEach(function(b){
    ctx.beginPath(); ctx.rect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = "rgba(56,189,248,.06)"; ctx.fill();
  });
  /* 走线（含折点折线） */
  wires.forEach(function(w){
    var a = endpoint(w.a), b = endpoint(w.b);
    var pts = [a].concat(w.pts || []).concat([b]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2.4; ctx.stroke();
  });
  /* 连接节点 */
  nodes.forEach(function(n){
    ctx.beginPath(); ctx.arc(n.x, n.y, 4.5, 0, 7); ctx.fillStyle = "#facc15"; ctx.fill();
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.4; ctx.stroke();
  });
  /* 标注文字 */
  texts.forEach(function(t){
    ctx.font = "13px system-ui"; ctx.textAlign = "left";
    ctx.fillStyle = "#e2e8f0";
    ctx.fillText(t.txt, t.x, t.y);
  });
  /* 元件 */
  parts.forEach(function(p){
    var hot = (selected && selected.id === p.id) || (placing && placing.id === p.id);
    drawPart(p, hot);
    [0,1].forEach(function(k){
      var n = nodeOf(p,k);
      ctx.beginPath(); ctx.arc(n.x, n.y, NODE_R, 0, 7);
      ctx.fillStyle = "#cbd5e1"; ctx.fill();
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, 7); ctx.fill();
    });
  });
  /* 拖线预览 */
  if (dragWire){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(dragWire.x0, dragWire.y0); ctx.lineTo(dragWire.x1, dragWire.y1);
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  }
  /* 走线折点预览 */
  if (mode === "wire" && wirePts.length){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(wirePts[0].x, wirePts[0].y);
    for (var j = 1; j < wirePts.length; j++) ctx.lineTo(wirePts[j].x, wirePts[j].y);
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
    wirePts.forEach(function(pt){ ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, 7); ctx.fillStyle = "#facc15"; ctx.fill(); });
  }
  /* 板框拖拽预览 */
  if (boardDrag){
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.rect(boardDrag.x0, boardDrag.y0, boardDrag.x1 - boardDrag.x0, boardDrag.y1 - boardDrag.y0);
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  }
  /* 放置预览 */
  if (placing){ ctx.globalAlpha = .45; drawPart(placing, true); ctx.globalAlpha = 1; }
}

function drawGrid(){
  ctx.strokeStyle = "rgba(51,65,85,.35)"; ctx.lineWidth = 1;
  var step = 30;
  for (var x = step; x < cv.clientWidth; x += step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.clientHeight); ctx.stroke(); }
  for (var y = step; y < cv.clientHeight; y += step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.clientWidth,y); ctx.stroke(); }
}

function drawPart(p, hot){
  ctx.save();
  var x = p.x, y = p.y;
  [0,1].forEach(function(k){ var n = nodeOf(p,k); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(n.x,n.y); ctx.strokeStyle = "#475569"; ctx.lineWidth = 1.6; ctx.stroke(); });
  var ink = hot ? "#facc15" : "#e2e8f0";
  if (p.type === "battery"){
    ctx.beginPath(); ctx.rect(x-34, y-14, 10, 28); ctx.fillStyle = "#475569"; ctx.fill();
    ctx.beginPath(); ctx.rect(x+24, y-14, 10, 28); ctx.fillStyle = "#475569"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-14,y); ctx.lineTo(x+14,y); ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-14,y-12); ctx.lineTo(x+14,y-12); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3; ctx.stroke();
    label(p, "🔋 " + fmtV(p.val), hot);
  } else if (p.type === "resistor"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-24, y); ctx.lineTo(x-16, y); ctx.lineTo(x-8, y-12); ctx.lineTo(x+8, y+12); ctx.lineTo(x+16, y); ctx.lineTo(x+24, y); ctx.stroke();
    label(p, "R " + fmtR(p.val), hot);
  } else if (p.type === "capacitor"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-20, y); ctx.lineTo(x-4, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2, y-14); ctx.lineTo(x-2, y+14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+2, y-14); ctx.lineTo(x+2, y+14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+4, y); ctx.lineTo(x+20, y); ctx.stroke();
    label(p, "C " + fmtC(p.val), hot);
  } else if (p.type === "inductor"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-24, y);
    ctx.arc(x-16, y, 8, Math.PI/2, -Math.PI/2, false);
    ctx.arc(x, y, 8, Math.PI/2, -Math.PI/2, false);
    ctx.arc(x+16, y, 8, Math.PI/2, -Math.PI/2, false);
    ctx.lineTo(x+24, y); ctx.stroke();
    label(p, "L " + fmtL(p.val), hot);
  } else if (p.type === "bulb"){
    ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-13,y); ctx.lineTo(x+13,y); ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.4; ctx.stroke();
    label(p, "💡", hot);
  } else if (p.type === "diode"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-22, y); ctx.lineTo(x-2, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2, y-12); ctx.lineTo(x-2, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2, y-12); ctx.lineTo(x+14, y); ctx.lineTo(x-2, y+12); ctx.closePath(); ctx.fillStyle = "#94a3b8"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+16, y); ctx.lineTo(x+22, y); ctx.stroke();
    label(p, "D", hot);
  } else if (p.type === "led"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-22, y); ctx.lineTo(x-2, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2, y-12); ctx.lineTo(x-2, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2, y-12); ctx.lineTo(x+14, y); ctx.lineTo(x-2, y+12); ctx.closePath(); ctx.fillStyle = "#ef4444"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+16, y); ctx.lineTo(x+22, y); ctx.stroke();
    /* 发光箭头 */
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x+12, y-9); ctx.lineTo(x+18, y-15); ctx.moveTo(x+18, y-15); ctx.lineTo(x+18, y-8); ctx.stroke();
    label(p, "LED", hot);
  } else if (p.type === "npn"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-20, y); ctx.lineTo(x-8, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-8, y); ctx.lineTo(x-8, y-12); ctx.stroke();  /* B 极（上方略偏） */
    ctx.beginPath(); ctx.moveTo(x+8, y); ctx.lineTo(x+30, y); ctx.stroke();  /* C 极 */
    ctx.beginPath(); ctx.moveTo(x-4, y+10); ctx.lineTo(x+4, y+10); ctx.lineTo(x-4, y+22); ctx.stroke();  /* E 极箭头 */
    ctx.beginPath(); ctx.moveTo(x-4, y+22); ctx.lineTo(x+4, y+22); ctx.stroke();
    ctx.fillStyle = "#94a3b8"; ctx.beginPath(); ctx.moveTo(x-5, y+12); ctx.lineTo(x+2, y+12); ctx.lineTo(x-1.5, y+9); ctx.closePath(); ctx.fill();
    label(p, "Q NPN", hot);
  } else if (p.type === "switch"){
    ctx.beginPath(); ctx.moveTo(x-24, y); ctx.lineTo(x+24, y); ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-4, y); ctx.lineTo(p.on ? (x+18, y) : (x+4, y-16)); ctx.strokeStyle = p.on ? "#10B981" : "#ef4444"; ctx.lineWidth = 2.6; ctx.stroke();
    label(p, p.on ? "开关 ON" : "开关 OFF", hot);
  } else if (p.type === "speaker"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-18, y); ctx.lineTo(x-6, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-6, y); ctx.lineTo(x-6, y-12); ctx.lineTo(x+6, y); ctx.lineTo(x-6, y+12); ctx.closePath(); ctx.fillStyle = "#263247"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+8, y); ctx.lineTo(x+18, y); ctx.stroke();
    label(p, "SP", hot);
  } else if (p.type === "transformer"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-70, y); ctx.lineTo(x-34, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-30, y-12); ctx.lineTo(x-30, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-26, y-12); ctx.lineTo(x-26, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+26, y-12); ctx.lineTo(x+26, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+30, y-12); ctx.lineTo(x+30, y+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+34, y); ctx.lineTo(x+70, y); ctx.stroke();
    label(p, "T 变压器", hot);
  } else if (p.type === "ground"){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x-14, y); ctx.lineTo(x+14, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-8, y+5); ctx.lineTo(x+8, y+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-3, y+10); ctx.lineTo(x+3, y+10); ctx.stroke();
    label(p, "GND", hot);
  }
  ctx.restore();
}

function label(p, t, hot){
  ctx.font = "11px system-ui"; ctx.textAlign = "center";
  var y = p.y - 28;
  if (hot){ ctx.fillStyle = "#0f172a"; var w = ctx.measureText(t).width + 12; ctx.fillRect(p.x - w/2, y - 12, w, 17); }
  ctx.fillStyle = hot ? "#facc15" : "#94a3b8";
  ctx.fillText(t, p.x, y);
}

function fmtV(v){ return (v >= 1000 ? (v/1000).toFixed(1)+"kV" : v.toFixed(1)+"V"); }
function fmtR(r){ return r >= 1e6 ? (r/1e6).toFixed(1)+"MΩ" : r >= 1000 ? (r/1000).toFixed(1)+"kΩ" : r.toFixed(0)+"Ω"; }
function fmtC(c){ return c >= 1e6 ? (c/1e6).toFixed(1)+"mF" : c >= 1000 ? (c/1000).toFixed(1)+"µF" : c.toFixed(0)+"nF"; }
function fmtL(l){ return l >= 1000 ? (l/1000).toFixed(1)+"H" : l.toFixed(0)+"mH"; }

/* ---------- 命中测试 ---------- */
function hitNode(px, py){
  for (var i = parts.length-1; i >= 0; i--){
    var p = parts[i];
    for (var k = 0; k < 2; k++){
      var n = nodeOf(p, k);
      if (Math.hypot(px-n.x, py-n.y) <= NODE_R + 6) return {pid:p.id, node:k};
    }
  }
  return null;
}
function hitPart(px, py){
  for (var i = parts.length-1; i >= 0; i--){
    var p = parts[i];
    var d = Math.hypot(px-p.x, py-p.y);
    var r = p.type === "bulb" ? 16 : 36;
    if (d <= r) return p;
  }
  return null;
}
function hitText(px, py){
  for (var i = texts.length-1; i >= 0; i--){ var t = texts[i]; if (Math.abs(px-t.x) <= 60 && Math.abs(py-t.y) <= 10) return t; }
  return null;
}
function hitNodePt(px, py){
  for (var i = nodes.length-1; i >= 0; i--){ var n = nodes[i]; if (Math.hypot(px-n.x, py-n.y) <= 8) return n; }
  return null;
}
function hitBoard(px, py){
  for (var i = boards.length-1; i >= 0; i--){ var b = boards[i]; if (px >= b.x0-4 && px <= b.x1+4 && py >= b.y0-4 && py <= b.y1+4) return b; }
  return null;
}
function hitWire(px, py){
  for (var i = wires.length-1; i >= 0; i--){
    var w = wires[i];
    var a = endpoint(w.a), b = endpoint(w.b);
    var pts = [a].concat(w.pts || []).concat([b]);
    for (var j = 0; j < pts.length-1; j++){
      var p1 = pts[j], p2 = pts[j+1];
      var d = Math.abs((p2.y-p1.y)*px - (p2.x-p1.x)*py + p2.x*p1.y - p2.y*p1.x) / Math.hypot(p2.x-p1.x, p2.y-p1.y);
      if (d <= 5 && px >= Math.min(p1.x,p2.x)-4 && px <= Math.max(p1.x,p2.x)+4 && py >= Math.min(p1.y,p2.y)-4 && py <= Math.max(p1.y,p2.y)+4) return w;
    }
  }
  return null;
}

/* ---------- 交互 ---------- */
function toLocal(e){ var r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

cv.addEventListener("pointerdown", function(e){
  var pt = toLocal(e);
  /* 放置元件 */
  if (placing){
    var p = addPart(placing.type, pt.x, pt.y); placing = null; mode = "select";
    document.querySelectorAll(".lib-btn").forEach(function(b){ b.classList.remove("on"); });
    refreshStatus(); draw(); return;
  }
  if (mode === "board"){
    boardDrag = {x0: snap(pt.x), y0: snap(pt.y), x1: snap(pt.x), y1: snap(pt.y)}; return;
  }
  if (mode === "erase"){
    var hp = hitPart(pt.x, pt.y);
    if (hp){ parts = parts.filter(function(p){ return p.id !== hp.id; }); wires = wires.filter(function(w){ return w.a.pid !== hp.id && w.b.pid !== hp.id; }); refreshStatus(); draw(); return; }
    var hw = hitWire(pt.x, pt.y);
    if (hw){ wires = wires.filter(function(w){ return w.id !== hw.id; }); refreshStatus(); draw(); return; }
    var ht = hitText(pt.x, pt.y);
    if (ht){ texts = texts.filter(function(t){ return t.id !== ht.id; }); refreshStatus(); draw(); return; }
    var hn = hitNodePt(pt.x, pt.y);
    if (hn){ nodes = nodes.filter(function(n){ return n.id !== hn.id; }); refreshStatus(); draw(); return; }
    var hb = hitBoard(pt.x, pt.y);
    if (hb){ boards = boards.filter(function(b){ return b.id !== hb.id; }); refreshStatus(); draw(); return; }
    return;
  }
  if (mode === "text"){
    var txt = window.prompt("标注内容：", "");
    if (txt){ texts.push({id:uid++, x:snap(pt.x), y:snap(pt.y), txt:txt}); refreshStatus(); draw(); }
    return;
  }
  if (mode === "node"){
    nodes.push({id:uid++, x:snap(pt.x), y:snap(pt.y)}); refreshStatus(); draw(); return;
  }
  if (mode === "wire"){
    var hn = hitNode(pt.x, pt.y);
    if (hn){
      if (!wirePts.length) wirePts.push({pid:hn.pid, node:hn.node});
      else{ finishWire({pid:hn.pid, node:hn.node}); }
      draw(); return;
    }
    if (wirePts.length){ wirePts.push({abs:true, x:snap(pt.x), y:snap(pt.y)}); draw(); return; }
    wirePts.push({abs:true, x:snap(pt.x), y:snap(pt.y)}); draw(); return;
  }
  /* select 模式 */
  var hn2 = hitNode(pt.x, pt.y);
  if (hn2){ dragWire = {x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y, from: hn2}; return; }
  var hp2 = hitPart(pt.x, pt.y);
  if (hp2){ selected = hp2; dragEl = hp2; dragNode = null; showProps(hp2); draw(); return; }
  selected = null; hideProps(); draw();
});
cv.addEventListener("pointermove", function(e){
  var pt = toLocal(e);
  if (dragWire){ dragWire.x1 = pt.x; dragWire.y1 = pt.y; draw(); return; }
  if (boardDrag){ boardDrag.x1 = snap(pt.x); boardDrag.y1 = snap(pt.y); draw(); return; }
  if (dragEl){
    var sp = snapPt(pt.x, pt.y); dragEl.x = sp.x; dragEl.y = sp.y;
    var dx = 55, dy = 0;
    dragEl.n0 = {x:sp.x-dx, y:sp.y}; dragEl.n1 = {x:sp.x+dx, y:sp.y};
    if (dragEl.type === "npn"){ dragEl.n1 = {x:sp.x+30, y:sp.y}; }
    if (dragEl.type === "transformer"){ dragEl.n0 = {x:sp.x-70,y:sp.y}; dragEl.n1 = {x:sp.x+70,y:sp.y}; }
    draw(); return;
  }
});
window.addEventListener("pointerup", function(e){
  var pt = toLocal(e);
  if (boardDrag){
    var x0 = Math.min(boardDrag.x0, boardDrag.x1), y0 = Math.min(boardDrag.y0, boardDrag.y1);
    var x1 = Math.max(boardDrag.x0, boardDrag.x1), y1 = Math.max(boardDrag.y0, boardDrag.y1);
    if (x1 - x0 >= 60 && y1 - y0 >= 40) boards.push({id:uid++, x0:x0, y0:y0, x1:x1, y1:y1});
    boardDrag = null; refreshStatus(); draw(); return;
  }
  if (dragWire){
    var hn = hitNode(pt.x, pt.y);
    if (hn && !(hn.pid === dragWire.from.pid && hn.node === dragWire.from.node)){
      var dup = wires.some(function(w){ return (w.a.pid===dragWire.from.pid&&w.a.node===dragWire.from.node&&w.b.pid===hn.pid&&w.b.node===hn.node) || (w.b.pid===dragWire.from.pid&&w.b.node===dragWire.from.node&&w.a.pid===hn.pid&&w.a.node===hn.node); });
      if (!dup) wires.push({id:uid++, a:dragWire.from, b:hn});
      else toast("已存在这条连线");
    }
    dragWire = null; refreshStatus(); draw(); return;
  }
  dragEl = null; dragNode = null;
});
cv.addEventListener("dblclick", function(e){
  if (mode === "wire" && wirePts.length){
    var pt = toLocal(e);
    var hn = hitNode(pt.x, pt.y);
    if (hn) finishWire({pid:hn.pid, node:hn.node});
    else finishWire({abs:true, x:snap(pt.x), y:snap(pt.y)});
    draw();
  }
});
function finishWire(endRef){
  var start = wirePts.shift();
  var pts = wirePts.slice(); wirePts = [];
  wires.push({id:uid++, a:start, b:endRef, pts:pts});
  refreshStatus(); toast("走线完成（继续画：再点起点；按 ESC 退出走线）");
}

/* ---------- 工具按钮 ---------- */
function setMode(m){
  mode = m;
  document.querySelectorAll(".tbtn").forEach(function(b){ b.classList.remove("on"); });
  if (m === "wire") document.getElementById("wireBtn").classList.add("on");
  if (m === "text") document.getElementById("textBtn").classList.add("on");
  if (m === "node") document.getElementById("nodeBtn").classList.add("on");
  if (m === "board") document.getElementById("boardBtn").classList.add("on");
  if (m === "erase") document.getElementById("eraseBtn").classList.add("on");
  if (m !== "place"){ placing = null; document.querySelectorAll(".lib-btn").forEach(function(b){ b.classList.remove("on"); }); }
  if (m !== "wire"){ wirePts = []; }
  hideProps();
}
document.getElementById("wireBtn").addEventListener("click", function(){ setMode(mode === "wire" ? "select" : "wire"); toast(mode === "wire" ? "走线模式：起点单击 → 折点单击 → 终点双击" : "已退出走线"); });
document.getElementById("textBtn").addEventListener("click", function(){ setMode(mode === "text" ? "select" : "text"); toast(mode === "text" ? "标注模式：在画布点击输入文字" : "已退出标注"); });
document.getElementById("nodeBtn").addEventListener("click", function(){ setMode(mode === "node" ? "select" : "node"); toast(mode === "node" ? "节点模式：点击画布放置连接点" : "已退出节点"); });
document.getElementById("boardBtn").addEventListener("click", function(){ setMode(mode === "board" ? "select" : "board"); toast(mode === "board" ? "板框模式：在画布拖出矩形板框" : "已退出板框"); });
document.getElementById("eraseBtn").addEventListener("click", function(){ setMode(mode === "erase" ? "select" : "erase"); toast(mode === "erase" ? "橡皮模式：点击要删除的元素（元件/走线/标注/节点/板框）" : "已退出橡皮"); });

document.getElementById("backBtn").addEventListener("click", function(){ location.href = "阅读器.html"; });
document.getElementById("pngBtn").addEventListener("click", function(){
  var a = document.createElement("a");
  a.download = "电路画板.png";
  a.href = cv.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
  toast("已导出 PNG（在浏览器下载文件夹中）");
});

document.querySelectorAll(".lib-btn").forEach(function(b){
  b.addEventListener("click", function(){
    var t = b.dataset.part;
    if (placing && placing.type === t){ placing = null; b.classList.remove("on"); mode="select"; return; }
    placing = {type:t, x:cv.clientWidth/2, y:cv.clientHeight/2};
    mode = "place";
    setMode("place");
    b.classList.add("on");
    hideProps(); draw();
  });
});
document.getElementById("libSearch").addEventListener("input", function(e){
  var kw = e.target.value.trim();
  document.querySelectorAll(".lib-btn").forEach(function(b){
    b.style.display = (!kw || b.textContent.toLowerCase().indexOf(kw.toLowerCase()) >= 0) ? "" : "none";
  });
});
document.getElementById("delBtn").addEventListener("click", function(){
  if (!selected) return toast("先点选一个元件");
  parts = parts.filter(function(p){ return p.id !== selected.id; });
  wires = wires.filter(function(w){ return w.a.pid !== selected.id && w.b.pid !== selected.id; });
  selected = null; hideProps(); refreshStatus(); draw();
});
document.getElementById("clearBtn").addEventListener("click", function(){
  parts = []; wires = []; texts = []; nodes = []; boards = [];
  selected = null; placing = null; wirePts = []; hideProps(); refreshStatus(); draw();
  document.querySelectorAll(".lib-btn, .tbtn").forEach(function(x){ x.classList.remove("on"); });
  mode = "select"; toast("画布已清空");
});
document.getElementById("shareBtn").addEventListener("click", share);
window.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ setMode("select"); toast("已退出当前工具"); }
});

/* ---------- 示例模板 ---------- */
var TEMPLATES = {
  series: { p: [[0,"battery",240,300,9,1],[1,"bulb",480,300,200,1]], w: [[{pid:0,node:1},{pid:1,node:0}],[{pid:1,node:1},{pid:0,node:0}]] },
  twolamp: { p: [[0,"battery",200,300,12,1],[1,"bulb",430,300,100,1],[2,"bulb",660,300,300,1]], w: [[{pid:0,node:1},{pid:1,node:0}],[{pid:1,node:1},{pid:2,node:0}],[{pid:2,node:1},{pid:0,node:0}]] },
  switch: { p: [[0,"battery",200,300,9,1],[1,"switch",430,300,0,1],[2,"bulb",660,300,200,1]], w: [[{pid:0,node:1},{pid:1,node:0}],[{pid:1,node:1},{pid:2,node:0}],[{pid:2,node:1},{pid:0,node:0}]] }
};
document.getElementById("tplSel").addEventListener("change", function(e){
  var key = e.target.value; e.target.value = "";
  if (!key || !TEMPLATES[key]) return;
  restore({v:2, p:TEMPLATES[key].p, w:TEMPLATES[key].w, t:[], n:[], b:[]});
  toast("已加载示例：" + ({series:"串联电路", twolamp:"双灯串联", switch:"开关控制"}[key]));
});

/* ---------- 属性面板 ---------- */
function showProps(p){
  var canVal = p.type === "battery" || p.type === "resistor" || p.type === "capacitor" || p.type === "inductor" || p.type === "bulb";
  propsEl.style.display = "block";
  var r = cv.getBoundingClientRect();
  propsEl.style.left = Math.min(p.x + 26, r.width - 210) + "px";
  propsEl.style.top = Math.max(8, p.y - 30) + "px";
  var h = "<h4>" + nameOf(p) + "</h4>";
  if (canVal){
    var cfg = {battery:[1,24,0.5,"电压"], resistor:[10,100000,10,"阻值"], capacitor:[1,1000,1,"容量"], inductor:[1,100,1,"电感"], bulb:[10,100000,10,"阻值"]}[p.type];
    h += '<label>' + cfg[3] + ' <input type="range" min="'+cfg[0]+'" max="'+cfg[1]+'" step="'+cfg[2]+'" value="'+p.val+'" data-f="val"></label>';
    h += '<label>数值 <input type="number" min="'+cfg[0]+'" max="'+cfg[1]+'" step="'+cfg[2]+'" value="'+p.val+'" data-f="val" style="width:70px"></label>';
  }
  if (p.type === "switch"){
    h += '<label>状态 <input type="checkbox" data-f="on" ' + (p.on?"checked":"") + '></label>';
  }
  h += '<button id="propClose">关闭</button>';
  propsEl.innerHTML = h;
  propsEl.querySelectorAll("[data-f]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (inp.dataset.f === "val") p.val = parseFloat(inp.value) || p.val;
      if (inp.dataset.f === "on") p.on = inp.checked;
      if (inp.dataset.f === "val"){
        propsEl.querySelectorAll("[data-f=val]").forEach(function(o){ if (o !== inp) o.value = inp.value; });
      }
      draw();
    });
  });
  propsEl.querySelector("#propClose").addEventListener("click", hideProps);
}
function nameOf(p){ return {battery:"🔋 电池", resistor:"➰ 电阻", capacitor:"⏺ 电容", inductor:"🌀 电感", bulb:"💡 灯泡", diode:"▶ 二极管", led:"🔴 LED", npn:"🔻 三极管", switch:"🔘 开关", speaker:"📢 扬声器", transformer:"⇋ 变压器", ground:"⏚ 接地"}[p.type] || p.type; }
function hideProps(){ propsEl.style.display = "none"; }

/* ---------- 状态栏 ---------- */
function refreshStatus(){
  statusEl.innerHTML = "元件 <b>" + parts.length + "</b> · 走线 <b>" + wires.length + "</b> · 标注 <b>" + texts.length + "</b> · 节点 <b>" + nodes.length + "</b> · 板框 <b>" + boards.length + "</b>";
}

/* ---------- 序列化 / 分享 ---------- */
function serialize(){
  return { v:2,
    p: parts.map(function(p){ return [p.id, p.type, Math.round(p.x), Math.round(p.y), p.val, p.on ? 1:0]; }),
    w: wires.map(function(w){ return [ w.a, w.b, w.pts || [] ]; }),
    t: texts.map(function(t){ return [t.x, t.y, t.txt]; }),
    n: nodes.map(function(n){ return [n.x, n.y]; }),
    b: boards.map(function(b){ return [b.x0, b.y0, b.x1, b.y1]; }) };
}
function restore(data){
  parts = []; wires = []; texts = []; nodes = []; boards = [];
  selected = null; placing = null; wirePts = [];
  var idMap = {};
  var legacy = data && Array.isArray(data.p) && data.p.length && typeof data.p[0][0] === "string";
  if (legacy || !data.v){
    /* 旧格式：[type,x,y,val,on] + w 为 [pid,node,pid,node] 数组 */
    data.p.forEach(function(a, i){
      var p = legacy ? addPart(a[0], a[1], a[2]) : addPart(a[1], a[2], a[3]);
      var v = legacy ? a[3] : a[4], on = legacy ? a[4] : a[5];
      p.val = v; p.on = on === 1;
      idMap[legacy ? i : a[0]] = p.id;
    });
    (data.w || []).forEach(function(w){
      if (Array.isArray(w) && w.length === 4){ wires.push({id:uid++, a:{pid:idMap[w[0]], node:w[1]}, b:{pid:idMap[w[2]], node:w[3]}}); }
    });
  } else {
    data.p.forEach(function(a){ var p = addPart(a[1], a[2], a[3]); p.val = a[4]; p.on = a[5] === 1; idMap[a[0]] = p.id; });
    (data.w || []).forEach(function(w){
      var a = w[0], b = w[1];
      var A = a.abs ? {abs:true, x:a.x, y:a.y} : {pid:idMap[a.pid], node:a.node};
      var B = b.abs ? {abs:true, x:b.x, y:b.y} : {pid:idMap[b.pid], node:b.node};
      wires.push({id:uid++, a:A, b:B, pts:(w[2] || []).map(function(q){ return q.abs ? {abs:true,x:q.x,y:q.y} : {pid:idMap[q.pid], node:q.node}; })});
    });
    (data.t || []).forEach(function(t){ texts.push({id:uid++, x:t[0], y:t[1], txt:t[2]}); });
    (data.n || []).forEach(function(n){ nodes.push({id:uid++, x:n[0], y:n[1]}); });
    (data.b || []).forEach(function(b){ boards.push({id:uid++, x0:b[0], y0:b[1], x1:b[2], y1:b[3]}); });
  }
  refreshStatus(); draw();
}
function share(){
  var s = JSON.stringify(serialize());
  var url = location.origin + location.pathname + "#" + encodeURIComponent(s);
  try{ navigator.clipboard.writeText(url).then(function(){ toast("画板链接已复制，粘贴到浏览器即可打开"); }); }
  catch(e){ toast(url.slice(0,60) + "…"); }
}
(function(){
  var h = location.hash.slice(1);
  if (h){
    try{ restore(JSON.parse(decodeURIComponent(h))); toast("已载入分享的画板"); }
    catch(e){ toast("画板链接无法解析"); }
  }
})();

function toast(msg){
  toastEl.textContent = msg; toastEl.style.opacity = "1";
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.style.opacity = "0"; }, 2400);
}

resize();
refreshStatus();
})();
</script>
